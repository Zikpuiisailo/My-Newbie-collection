
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - Online Shopping</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f6fa;color:#222}
header{background:#171923;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.logo{font-size:26px;font-weight:bold;color:#ffb703}
.search{padding:11px;border-radius:8px;border:none;width:280px;max-width:100%}
button{cursor:pointer;border:none;border-radius:7px;padding:10px 15px;font-weight:bold}
.cart-btn{background:#ffb703;color:#222}
.hero{padding:65px 7%;background:linear-gradient(120deg,#202b50,#5265a7);color:white}
.hero h1{font-size:42px;margin-bottom:15px}
.hero p{margin-bottom:22px}
.hero button{background:#ffb703;padding:13px 22px}
section{padding:35px 6%}
.categories{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.categories button{background:white;border:1px solid #ddd}
.categories button.active,.categories button:hover{background:#202b50;color:white}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #0001;transition:.2s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;height:190px;object-fit:cover;background:#eee}
.card-content{padding:16px}
.card h3{margin-bottom:9px}
.price{font-size:20px;color:#e07800;font-weight:bold;margin:12px 0}
.add{background:#202b50;color:white;width:100%}
.add:hover{background:#ffb703;color:#222}
#cart{background:white;border-radius:12px;padding:20px;margin-top:25px}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;gap:10px}
.cart-item button{background:#eee}
.total{font-size:22px;font-weight:bold;text-align:right;margin-top:20px}
.checkout{background:#ffb703;width:100%;margin-top:15px;padding:14px}
footer{text-align:center;background:#171923;color:white;padding:25px;margin-top:40px}
.empty{text-align:center;padding:25px;color:#888}
@media(max-width:600px){
header{justify-content:center}
.hero h1{font-size:32px}
.search{width:100%}
}
</style>
</head>
<body>

<header>
  <div class="logo">ShopEase.</div>
  <input class="search" id="search" placeholder="Search products..." oninput="renderProducts()">
  <button class="cart-btn" onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})">
    🛒 Cart (<span id="count">0</span>)
  </button>
</header>

<div class="hero">
  <h1>Discover Your Style</h1>
  <p>Find amazing products at unbeatable prices.</p>
  <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">Shop Now →</button>
</div>

<section id="shop">
  <h2>Explore Products</h2>
  <div class="categories" id="categories">
    <button class="active" onclick="filter('All',this)">All</button>
    <button onclick="filter('Electronics',this)">Electronics</button>
    <button onclick="filter('Fashion',this)">Fashion</button>
    <button onclick="filter('Home',this)">Home</button>
    <button onclick="filter('Accessories',this)">Accessories</button>
  </div>
  <div class="products" id="products"></div>

  <div id="cart">
    <h2>🛒 Shopping Cart</h2>
    <div id="cart-items" class="empty">Your cart is empty.</div>
    <div class="total">Total: ₹<span id="total">0</span></div>
    <button class="checkout" onclick="checkout()">Proceed to Checkout</button>
  </div>
</section>

<footer>
  <h3>ShopEase.</h3>
  <p>Shopping made simple. © 2026 ShopEase</p>
</footer>

<script>
const products=[
{id:1,name:"Wireless Headphones",cat:"Electronics",price:1999,img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"},
{id:2,name:"Smart Watch",cat:"Electronics",price:2499,img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"},
{id:3,name:"Running Shoes",cat:"Fashion",price:1799,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{id:4,name:"Classic Backpack",cat:"Fashion",price:1299,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"},
{id:5,name:"Modern Lamp",cat:"Home",price:899,img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=500"},
{id:6,name:"Coffee Maker",cat:"Home",price:2199,img:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500"},
{id:7,name:"Sunglasses",cat:"Accessories",price:699,img:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500"},
{id:8,name:"Leather Watch",cat:"Accessories",price:1599,img:"https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=500"}
];

let cart=[];
let category="All";

function renderProducts(){
const search=document.getElementById('search').value.toLowerCase();
const list=products.filter(p=>
(category==="All"||p.cat===category)&&p.name.toLowerCase().includes(search)
);
document.getElementById('products').innerHTML=list.map(p=>`
<div class="card">
<img src="${p.img}" alt="${p.name}" loading="lazy">
<div class="card-content">
<h3>${p.name}</h3>
<small>${p.cat}</small>
<div class="price">₹${p.price.toLocaleString('en-IN')}</div>
<button class="add" onclick="addToCart(${p.id})">Add to Cart</button>
</div>
</div>`).join('')||'<p>No products found.</p>';
}

function filter(cat,btn){
category=cat;
document.querySelectorAll('.categories button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
renderProducts();
}

function addToCart(id){
const item=cart.find(p=>p.id===id);
if(item)item.qty++;
else cart.push({...products.find(p=>p.id===id),qty:1});
renderCart();
}

function changeQty(id,amount){
const item=cart.find(p=>p.id===id);
if(!item)return;
item.qty+=amount;
if(item.qty<=0)cart=cart.filter(p=>p.id!==id);
renderCart();
}

function renderCart(){
const container=document.getElementById('cart-items');
document.getElementById('count').textContent=cart.reduce((s,p)=>s+p.qty,0);
if(!cart.length){
container.innerHTML='Your cart is empty.';
container.className='empty';
}else{
container.className='';
container.innerHTML=cart.map(p=>`
<div class="cart-item">
<div><b>${p.name}</b><br>₹${p.price.toLocaleString('en-IN')} × ${p.qty}</div>
<div>
<button onclick="changeQty(${p.id},-1)">−</button>
${p.qty}
<button onclick="changeQty(${p.id},1)">+</button>
<button onclick="changeQty(${p.id},-${p.qty})">🗑</button>
</div>
</div>`).join('');
}
document.getElementById('total').textContent=
cart.reduce((s,p)=>s+p.price*p.qty,0).toLocaleString('en-IN');
}

function checkout(){
if(!cart.length){
alert('Your cart is empty!');
return;
}
alert('Checkout demo! Connect a payment gateway and backend to accept real orders.');
}

renderProducts();
renderCart();
</script>
</body>
</html>
